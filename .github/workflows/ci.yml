name: Brain Arena CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Release consistency
        run: npm run check:release
      - name: Unit tests
        run: npm test
      - name: Lint first-party code
        run: npm run lint
      - name: Production build
        run: npm run build
